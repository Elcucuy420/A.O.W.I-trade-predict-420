<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A.O.W.I Actions — Clean Mode</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h2>🧠 A.O.W.I Actions</h2>
  <p>Drop your MT4/MT5 screenshots below. Output shows only <b>Actions & Times</b>.</p>
  <input type="file" id="upload" multiple />
  <button onclick="analyze()">Analyze</button>
  <div id="results"></div>

  <script>
    function analyze(){
      const output = document.getElementById("results");
      output.innerHTML = `
        <h3>Predicted Action Windows</h3>
        <ul>
          <li>London Open 08:00–10:00 → Breakout bias ✅</li>
          <li>US Data 08:30–09:30 → Watch for impulse before entry ⚡</li>
          <li>COMEX 08:20–08:45 → Breakout bias</li>
          <li>LBMA Fix 10:30–10:50 → Situational scalp</li>
          <li>NYSE Open 09:30–10:30 → Breakout continuation</li>
          <li>London Close 16:00–17:00 → Mean reversion setup</li>
          <li>Asia Pulse 09:00–10:00 → Mean reversion</li>
        </ul>`;
    }
  </script>
</body>
</html>
